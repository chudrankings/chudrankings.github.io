<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chud Rankings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --bg-color: #020202;
            --panel-bg: rgba(10, 10, 10, 0.85);
            --neon-green: #39ff14;
            --neon-green-dim: #1a660a;
            --neon-red: #ff073a;
            --neon-admin: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #555555;
            --border-glow: rgba(57, 255, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body::after {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative;
        }

        .header {
            padding: 20px 30px; font-family: 'Orbitron', sans-serif; font-size: 2rem; font-weight: 900;
            color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); letter-spacing: 4px;
            border-bottom: 1px solid var(--neon-green-dim); background: linear-gradient(90deg, rgba(10, 10, 10, 0.9), rgba(0, 0, 0, 0.9));
            backdrop-filter: blur(10px); z-index: 10; position: relative; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.5s ease;
        }

        body.admin-mode .header { color: var(--neon-admin); text-shadow: 0 0 15px var(--neon-admin); border-bottom-color: var(--neon-admin); }

        .search-container { position: relative; width: 300px; }
        
        .search-bar {
            width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--neon-green-dim);
            color: var(--neon-green); font-family: 'Orbitron', sans-serif; padding: 10px 15px;
            border-radius: 4px; outline: none; transition: all 0.3s; text-transform: uppercase;
        }

        body.admin-mode .search-bar { border-color: var(--neon-admin); color: var(--neon-admin); }
        .search-bar:focus { box-shadow: 0 0 15px var(--border-glow); border-color: var(--neon-green); }
        body.admin-mode .search-bar:focus { box-shadow: 0 0 15px var(--neon-admin); border-color: var(--neon-admin); }

        .container { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 85px); overflow: hidden; z-index: 3; position: relative; }

        .list-section {
            flex: 1.2; background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 15px; overflow-y: auto; position: relative; backdrop-filter: blur(5px); box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .list-section::-webkit-scrollbar { width: 4px; }
        .list-section::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 2px; }

        .rank-item {
            display: flex; justify-content: space-between; align-items: center; padding: 14px 18px;
            background: rgba(20, 20, 20, 0.6); margin-bottom: 10px; border-radius: 8px; cursor: pointer;
            border: 1px solid transparent; border-left: 4px solid #333; transition: all 0.2s;
        }
        .rank-item:hover { background: rgba(30, 30, 30, 0.8); border-color: #444; transform: translateX(5px); }
        .rank-item.active { background: rgba(15, 40, 15, 0.8); border-color: var(--neon-green); border-left: 4px solid var(--neon-green); }

        .rank-item.god-tier { border-left: 4px solid var(--neon-red); background: linear-gradient(90deg, rgba(255,7,58,0.15), rgba(0,0,0,0.5)); }
        .rank-item.god-tier.active { border-color: var(--neon-red); box-shadow: 0 0 30px rgba(255,7,58,0.5); }
        .rank-item.god-tier .rank-number, .rank-item.god-tier .rank-score-mini { color: var(--neon-red) !important; border-color: var(--neon-red); }

        .rank-number { font-family: 'Orbitron', sans-serif; color: var(--neon-green); font-size: 1.2rem; font-weight: 900; width: 50px; }
        .rank-name { flex: 1; font-size: 1.4rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rank-score-mini { font-family: 'Orbitron', sans-serif; color: #fff; background: #000; padding: 4px 10px; border-radius: 6px; font-weight: 900; border: 1px solid var(--text-muted); text-align: center; }
        .rank-item.active .rank-score-mini { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }

        .detail-section {
            flex: 1; background: radial-gradient(circle at top right, rgba(20,20,20,0.9) 0%, rgba(5,5,5,0.95) 100%);
            border: 1px solid var(--glass-border); border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; padding: 30px; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .profile-img-container { width: 200px; height: 200px; border-radius: 12px; border: 2px solid var(--neon-green); overflow: hidden; margin-bottom: 20px; background-color: #050505; }
        .profile-img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; text-transform: uppercase; margin-bottom: 5px; text-align: center; }

        .vote-console { display: flex; gap: 25px; margin-bottom: 20px; background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 8px; border: 1px solid #333; }
        .vote-btn { background: transparent; border: 1px solid #555; color: var(--text-muted); font-family: 'Orbitron', sans-serif; padding: 8px 15px; cursor: pointer; transition: 0.2s; }
        .vote-btn:hover { background: rgba(255,255,255,0.05); }
        .vote-btn.up:active { border-color: var(--neon-green); color: var(--neon-green); }
        .vote-btn.down:active { border-color: var(--neon-red); color: var(--neon-red); }

        .admin-panel { display: none; flex-direction: column; align-items: center; width: 100%; background: rgba(188,19,254,0.05); border: 1px dashed var(--neon-admin); padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        body.admin-mode .admin-panel { display: flex; }
        body.admin-mode .vote-console { display: none; }

        .admin-title { font-family: 'Orbitron', sans-serif; color: var(--neon-admin); margin-bottom: 10px; letter-spacing: 2px; }
        .admin-stats { display: flex; gap: 20px; margin-bottom: 15px; color: #ccc; font-family: 'Orbitron', sans-serif; }
        .admin-stats span.up { color: var(--neon-green); }
        .admin-stats span.down { color: var(--neon-red); }
        .admin-score-editor { display: flex; gap: 15px; align-items: center; }
        .admin-edit-btn { background: rgba(188,19,254,0.1); border: 1px solid var(--neon-admin); color: var(--neon-admin); font-size: 1.5rem; width: 40px; height: 40px; cursor: pointer; font-family: 'Orbitron', sans-serif; }

        .profile-score { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--neon-green); font-weight: 900; margin-bottom: 15px; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6); }
        .profile-desc { color: #ccc; text-align: center; line-height: 1.6; width: 100%; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px solid #222; }

        .toast { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); border: 1px solid var(--neon-green); color: var(--neon-green); font-family: 'Orbitron', sans-serif; padding: 12px 25px; border-radius: 4px; box-shadow: 0 0 20px rgba(57,255,20,0.4); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .toast.error { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255,7,58,0.4); }
        .toast.admin { border-color: var(--neon-admin); color: var(--neon-admin); box-shadow: 0 0 20px rgba(188,19,254,0.4); }

        #profile-content { display: none; flex-direction: column; align-items: center; width: 100%; }
        #empty-state { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: var(--text-muted); font-family: 'Orbitron', sans-serif; font-size: 1.2rem; border: 1px dashed #333; width: 100%; border-radius: 8px; }

        .detail-section.god-tier-active .profile-img-container { border-color: var(--neon-red); box-shadow: 0 0 35px rgba(255, 7, 58, 0.6); }
        .detail-section.god-tier-active .profile-score { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 7, 58, 0.8); }
    </style>
</head>
<body>

    <div class="header">
        <span id="header-text">// CHUD_RANKINGS_</span>
        <div class="search-container">
            <input type="text" id="search-bar" class="search-bar" placeholder="SEARCH DATABASE...">
        </div>
    </div>

    <div id="system-toast" class="toast">SYSTEM MESSAGE</div>

    <div class="container">
        <div class="list-section" id="list-container"></div>

        <div class="detail-section" id="detail-terminal">
            <div id="empty-state">
                <div style="font-size: 3rem; margin-bottom:10px;">?</div>
                AWAITING SUBJECT OVERRIDE
            </div>
            
            <div id="profile-content">
                <div class="profile-img-container"><img id="display-img" class="profile-img" src="" alt="Face"></div>
                <h1 id="display-name" class="profile-name">Name</h1>
                <div class="profile-score">SCORE: <span id="display-score">0</span></div>

                <div class="admin-panel" id="admin-panel">
                    <div class="admin-title">ADMIN OVERRIDE ACTIVE</div>
                    <div class="admin-stats">
                        Upvotes: <span class="up" id="admin-upvotes">0</span> | 
                        Downvotes: <span class="down" id="admin-downvotes">0</span>
                    </div>
                    <div class="admin-score-editor">
                        <button class="admin-edit-btn" id="admin-minus">-</button>
                        <span style="font-family: 'Orbitron'; color: #fff;">ADJUST SCORE</span>
                        <button class="admin-edit-btn" id="admin-plus">+</button>
                    </div>
                </div>

                <div class="vote-console" id="vote-console">
                    <button class="vote-btn up" id="vote-up">▲ UPVOTE</button>
                    <button class="vote-btn down" id="vote-down">▼ DOWNVOTE</button>
                </div>

                <p id="display-desc" class="profile-desc">Description goes here.</p>
            </div>
        </div>
    </div>

    <script>
        let chudData = [
            { id: "god_0", name: "Darius, Vidhur & Mukil", score: 0, upvotes: 0, downvotes: 0, desc: "System Sovereigns. Their collective data structures completely overflowed the matrix, permanently breaking the system. Voting logic immune.", img: "images/0.jpg" },
            { id: "c_1", name: "Sofiane Moundir", score: 99, upvotes: 42, downvotes: 3, desc: "The ultimate walking paradox. Undeniably the biggest chud to ever roam the matrix, yet radiates absolute legendary Chad energy.", img: "images/1.jpg" },
            { id: "c_2", name: "Chudley", score: 98, upvotes: 12, downvotes: 1, desc: "An absolute unit. Emits pure radioactive power cells.", img: "images/2.jpg" },
            { id: "c_3", name: "GigaChud", score: 97, upvotes: 24, downvotes: 5, desc: "Jawline completely sharper than a diamond pickaxe.", img: "images/3.jpg" },
            { id: "c_4", name: "Barnaby", score: 95, upvotes: 8, downvotes: 2, desc: "Eats structural drywall panels for breakfast.", img: "images/4.jpg" }
        ];

        for(let i = 5; i <= 30; i++) {
            chudData.push({
                id: `gen_${i}`,
                name: "Subject_" + i,
                score: Math.floor(Math.random() * 41) + 35,
                upvotes: Math.floor(Math.random() * 10),
                downvotes: Math.floor(Math.random() * 5),
                desc: `System data file [${i}] uninitialized.`,
                img: `images/${i}.jpg`
            });
        }

        const listContainer = document.getElementById('list-container');
        const searchBar = document.getElementById('search-bar');
        const emptyState = document.getElementById('empty-state');
        const profileContent = document.getElementById('profile-content');
        
        let activeSubjectId = null;
        let searchQuery = "";
        let isAdminMode = false;

        function showToast(msg, type = 'normal') {
            const toast = document.getElementById('system-toast');
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        function sortMatrix() {
            const godTier = chudData[0];
            const mortals = chudData.slice(1).sort((a, b) => b.score - a.score);
            chudData = [godTier, ...mortals];
        }

        function renderList() {
            listContainer.innerHTML = '';
            const filteredData = chudData.filter(chud => chud.name.toLowerCase().includes(searchQuery.toLowerCase()));

            filteredData.forEach((chud) => {
                const realIndex = chudData.findIndex(c => c.id === chud.id);
                const isGodTier = realIndex === 0;
                const item = document.createElement('div');
                item.className = `rank-item ${isGodTier ? 'god-tier' : ''} ${chud.id === activeSubjectId ? 'active' : ''}`;
                
                item.innerHTML = `<div class="rank-number">#${realIndex}</div><div class="rank-name">${chud.name}</div><div class="rank-score-mini">${chud.score}</div>`;
                item.addEventListener('click', () => loadDossier(chud.id));
                listContainer.appendChild(item);
            });
        }

        function loadDossier(id) {
            activeSubjectId = id;
            const chud = chudData.find(c => c.id === id);
            const isGodTier = chudData.indexOf(chud) === 0;

            renderList();
            emptyState.style.display = 'none';
            profileContent.style.display = 'flex';

            document.getElementById('display-name').textContent = chud.name;
            document.getElementById('display-score').textContent = chud.score;
            document.getElementById('display-desc').textContent = chud.desc;
            document.getElementById('display-img').src = chud.img;

            document.getElementById('admin-upvotes').textContent = chud.upvotes;
            document.getElementById('admin-downvotes').textContent = chud.downvotes;

            const dt = document.getElementById('detail-terminal');
            if(isGodTier) {
                dt.classList.add('god-tier-active');
                document.getElementById('vote-console').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'none';
            } else {
                dt.classList.remove('god-tier-active');
                document.getElementById('admin-panel').style.display = isAdminMode ? 'flex' : 'none';
                document.getElementById('vote-console').style.display = isAdminMode ? 'none' : 'flex';
            }
        }

        // INSTANT ADMIN TRIGGER (No Enter Key Required)
        searchBar.addEventListener('input', (e) => {
            if (e.target.value === '//ADMIN') {
                isAdminMode = !isAdminMode;
                document.body.classList.toggle('admin-mode', isAdminMode);
                document.getElementById('header-text').textContent = isAdminMode ? '// CHUD_MATRIX_ADMIN' : '// CHUD_MATRIX_OS';
                showToast(isAdminMode ? "ADMIN PRIVILEGES GRANTED" : "ADMIN LOGGED OUT", "admin");
                e.target.value = ''; // Instantly clear the box
                searchQuery = '';
                if(activeSubjectId) loadDossier(activeSubjectId);
                renderList();
                return;
            }
            searchQuery = e.target.value;
            renderList();
        });

        // SEPARATE COOLDOWN LOGIC
        function castPublicVote(type) {
            if (!activeSubjectId) return;
            const chudIndex = chudData.findIndex(c => c.id === activeSubjectId);
            if (chudIndex === 0) return;

            const now = Date.now();
            const cooldownPeriod = 24 * 60 * 60 * 1000;
            const storageKey = type === 'up' ? 'chud_matrix_last_upvote' : 'chud_matrix_last_downvote';
            const lastVoteTime = localStorage.getItem(storageKey);

            if (lastVoteTime && (now - parseInt(lastVoteTime)) < cooldownPeriod) {
                showToast(`DENIED: 24H ${type.toUpperCase()}VOTE COOLDOWN ACTIVE`, "error");
                return;
            }

            if (type === 'up') chudData[chudIndex].upvotes++;
            else chudData[chudIndex].downvotes++;

            localStorage.setItem(storageKey, now.toString());
            showToast(`${type.toUpperCase()}VOTE LOGGED. 24H COOLDOWN INITIATED.`);
            loadDossier(activeSubjectId);
        }

        document.getElementById('vote-up').addEventListener('click', () => castPublicVote('up'));
        document.getElementById('vote-down').addEventListener('click', () => castPublicVote('down'));

        // ADMIN CONTROLS
        function adminChangeScore(delta) {
            if (!activeSubjectId || !isAdminMode) return;
            const chudIndex = chudData.findIndex(c => c.id === activeSubjectId);
            if (chudIndex === 0) return;

            chudData[chudIndex].score += delta;
            sortMatrix();
            loadDossier(activeSubjectId);
            showToast("SCORE OVERRIDDEN", "admin");
        }

        document.getElementById('admin-plus').addEventListener('click', () => adminChangeScore(1));
        document.getElementById('admin-minus').addEventListener('click', () => adminChangeScore(-1));

        sortMatrix();
        renderList();
    </script>
</body>
</html>
