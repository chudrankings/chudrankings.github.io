<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>// CHUD_RANKINGS_</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --bg-color: #030303;
            --panel-bg: rgba(10, 10, 10, 0.85);
            --neon-green: #39ff14;
            --neon-green-dim: #114d06;
            --neon-red: #ff073a;
            --neon-admin: #bc13fe;
            --text-main: #ffffff;
            --text-muted: #444444;
            --glass-border: rgba(255, 255, 255, 0.05);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 5; background-size: 100% 3px, 3px 100%; pointer-events: none;
        }

        body {
            background-color: var(--bg-color); color: var(--text-main); font-family: 'Rajdhani', sans-serif;
            display: flex; flex-direction: column; height: 100vh; overflow: hidden; position: relative;
        }

        /* Top Header Navigation */
        .header {
            padding: 15px 30px; font-family: 'Orbitron', sans-serif; font-size: 1.8rem; font-weight: 900;
            color: var(--neon-green); text-shadow: 0 0 15px var(--neon-green); letter-spacing: 3px;
            border-bottom: 2px solid var(--neon-green-dim); background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px); z-index: 10; display: flex; justify-content: space-between; align-items: center;
            transition: all 0.4s ease;
        }
        
        #system-title { cursor: pointer; user-select: none; }
        body.admin-mode .header { color: var(--neon-admin); text-shadow: 0 0 15px var(--neon-admin); border-bottom-color: var(--neon-admin); }

        .search-bar {
            width: 250px; background: rgba(0, 0, 0, 0.6); border: 1px solid var(--neon-green-dim);
            color: var(--neon-green); font-family: 'Orbitron', sans-serif; padding: 8px 12px;
            border-radius: 4px; outline: none; font-size: 0.85rem;
        }

        /* Main Window Layout */
        .container { display: flex; flex: 1; padding: 20px; gap: 20px; height: calc(100vh - 75px); overflow: hidden; z-index: 3; }

        .sidebar-panel {
            flex: 1.2; background: var(--panel-bg); border: 1px solid var(--glass-border); border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; gap: 15px; box-shadow: inset 0 0 30px rgba(0,0,0,0.9); position: relative;
        }

        .list-section { flex: 1; overflow-y: auto; padding-right: 4px; }
        .list-section::-webkit-scrollbar { width: 4px; }
        .list-section::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 2px; }
        body.admin-mode .list-section::-webkit-scrollbar-thumb { background: var(--neon-admin); }

        /* Premium Rank Items */
        .rank-item {
            display: flex; justify-content: space-between; align-items: center; padding: 12px 16px;
            background: rgba(20, 20, 20, 0.5); margin-bottom: 8px; border-radius: 6px; cursor: pointer;
            border: 1px solid transparent; border-left: 4px solid #252525; transition: all 0.2s ease;
        }
        .rank-item:hover { background: rgba(30, 30, 30, 0.7); transform: translateX(4px); }
        .rank-item.active { background: rgba(15, 45, 15, 0.6); border-color: var(--neon-green); border-left-color: var(--neon-green); }
        body.admin-mode .rank-item.active { background: rgba(45, 15, 45, 0.6); border-color: var(--neon-admin); border-left-color: var(--neon-admin); }

        .rank-item.god-tier { border-left-color: var(--neon-red); background: linear-gradient(90deg, rgba(255,7,58,0.1), rgba(0,0,0,0.4)); }
        .rank-item.god-tier.active { border-color: var(--neon-red); box-shadow: 0 0 20px rgba(255,7,58,0.3); }

        .rank-number { font-family: 'Orbitron', sans-serif; color: var(--neon-green); font-size: 1.1rem; font-weight: 700; width: 45px; }
        body.admin-mode .rank-number { color: var(--neon-admin); }
        .rank-item.god-tier .rank-number { color: var(--neon-red); }
        
        .rank-name { flex: 1; font-size: 1.3rem; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        /* Public Voting Mini Displays (Hidden from non-admins by default, or keep them subtle) */
        .vote-tallies { display: flex; gap: 8px; margin-right: 15px; font-family: 'Orbitron', sans-serif; font-size: 0.8rem; font-weight: 700; }
        .tally-up { color: var(--neon-green); opacity: 0.6; }
        .tally-down { color: var(--neon-red); opacity: 0.6; }
        .rank-item.active .tally-up, .rank-item.active .tally-down { opacity: 1; }

        .rank-score-mini { font-family: 'Orbitron', sans-serif; background: #000; padding: 3px 10px; border-radius: 4px; font-weight: 900; border: 1px solid #333; min-width: 45px; text-align: center; }
        .rank-item.active .rank-score-mini { border-color: var(--neon-green); color: var(--neon-green); }
        body.admin-mode .rank-item.active .rank-score-mini { border-color: var(--neon-admin); color: var(--neon-admin); }
        .rank-item.god-tier .rank-score-mini { border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

        /* Dossier Detail Frame */
        .detail-panel {
            flex: 1; background: radial-gradient(circle at top right, rgba(15,15,15,0.95) 0%, rgba(5,5,5,1) 100%);
            border: 1px solid var(--glass-border); border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; padding: 25px; box-shadow: inset 0 0 40px rgba(0,0,0,1); position: relative;
        }

        .profile-frame { width: 180px; height: 180px; border-radius: 8px; border: 2px solid var(--neon-green); overflow: hidden; margin-bottom: 15px; background: #000; transition: border 0.3s; }
        body.admin-mode .profile-frame { border-color: var(--neon-admin); }
        .detail-panel.god-active .profile-frame { border-color: var(--neon-red); box-shadow: 0 0 25px rgba(255,7,58,0.5); }
        .profile-img { width: 100%; height: 100%; object-fit: cover; }

        .profile-name { font-family: 'Orbitron', sans-serif; font-size: 2rem; margin-bottom: 5px; text-align: center; font-weight: 900; letter-spacing: 1px; }
        .profile-score { font-family: 'Orbitron', sans-serif; font-size: 2rem; color: var(--neon-green); font-weight: 900; margin-bottom: 15px; }
        body.admin-mode .profile-score { color: var(--neon-admin); text-shadow: 0 0 10px rgba(188,19,254,0.4); }
        .detail-panel.god-active .profile-score { color: var(--neon-red); text-shadow: 0 0 10px rgba(255,7,58,0.4); }

        /* Functional Components */
        .vote-console { display: flex; gap: 15px; margin-bottom: 25px; }
        .vote-btn { background: transparent; border: 1px solid #444; color: #fff; font-family: 'Orbitron', sans-serif; padding: 8px 16px; cursor: pointer; font-weight: 700; border-radius: 4px; transition: all 0.2s; }
        .vote-btn:hover { background: rgba(255,255,255,0.04); }
        .vote-btn.up:active { border-color: var(--neon-green); color: var(--neon-green); }
        .vote-btn.down:active { border-color: var(--neon-red); color: var(--neon-red); }

        .admin-override-box { display: none; flex-direction: column; align-items: center; width: 100%; background: rgba(188,19,254,0.04); border: 1px dashed var(--neon-admin); padding: 15px; border-radius: 6px; margin-bottom: 20px; }
        body.admin-mode .admin-override-box { display: flex; }
        body.admin-mode .vote-console { display: none; }

        .admin-btn-group { display: flex; gap: 15px; align-items: center; margin-top: 10px; }
        .admin-action { background: rgba(188,19,254,0.1); border: 1px solid var(--neon-admin); color: var(--neon-admin); font-size: 1.3rem; width: 36px; height: 36px; cursor: pointer; font-family: 'Orbitron'; font-weight: 900; border-radius: 4px; }
        .admin-action:hover { background: var(--neon-admin); color: #fff; }

        .profile-desc { color: #bbbbbb; text-align: center; line-height: 1.5; font-size: 0.95rem; width: 100%; background: rgba(0,0,0,0.4); padding: 15px; border-radius: 6px; border: 1px solid #1a1a1a; flex: 1; overflow-y: auto; }

        /* System Messages */
        .toast { position: absolute; top: 15px; left: 50%; transform: translateX(-50%); background: #000; border: 1px solid var(--neon-green); color: var(--neon-green); font-family: 'Orbitron', sans-serif; padding: 10px 20px; border-radius: 4px; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; font-size: 0.9rem; font-weight: 700; }
        .toast.err { border-color: var(--neon-red); color: var(--neon-red); }
        .toast.adm { border-color: var(--neon-admin); color: var(--neon-admin); }

        #empty-view { display: flex; height: 100%; width: 100%; border: 1px dashed #222; border-radius: 8px; justify-content: center; align-items: center; color: var(--text-muted); font-family: 'Orbitron'; font-size: 1.1rem; }

        /* ABSOLUTE COVERT SECURITY INPUT PORTAL (BOTTOM RIGHT CORNER) */
        .stealth-portal {
            position: absolute; bottom: 8px; right: 12px; z-index: 1000;
            display: flex; align-items: center; gap: 5px; font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem; color: #222; transition: color 0.3s;
        }
        body.admin-mode .stealth-portal { color: rgba(188, 19, 254, 0.2); }
        .stealth-input {
            background: transparent; border: none; outline: none; width: 65px;
            font-family: 'Orbitron', sans-serif; font-size: 0.65rem; color: transparent;
            text-align: right; caret-color: transparent;
        }
        body.admin-mode .stealth-input { color: rgba(188, 19, 254, 0.2); }
    </style>
</head>
<body>

    <div class="header">
        <span id="system-title" onclick="disengageOverride()">// CHUD_RANKINGS_</span>
        <input type="text" id="search-bar" class="search-bar" placeholder="FILTER TARGETS...">
    </div>

    <div id="alert-toast" class="toast">SYSTEM ALERT</div>

    <div class="container">
        <div class="sidebar-panel">
            <div class="list-section" id="list-frame"></div>
        </div>

        <div class="detail-panel" id="detail-frame">
            <div id="empty-view">SECURE DISPATCH TERMINAL IDLE</div>
            
            <div id="dossier-layout" style="display:none; flex-direction:column; align-items:center; width:100%; height:100%;">
                <div class="profile-frame"><img id="p-img" class="profile-img" src="" alt="Dossier Asset"></div>
                <h1 id="p-name" class="profile-name">---</h1>
                <div class="profile-score">SCORE: <span id="p-score">0</span></div>

                <!-- Live Public Interaction Node -->
                <div class="vote-console" id="public-console">
                    <button class="vote-btn up" id="btn-up">▲ UPVOTE</button>
                    <button class="vote-btn down" id="btn-down">▼ DOWNVOTE</button>
                </div>

                <!-- Dedicated Admin Shift System -->
                <div class="admin-override-box">
                    <div style="font-family:'Orbitron'; color:var(--neon-admin); font-size:0.8rem; letter-spacing:1px;">CORE DATABASE OVERRIDE</div>
                    <div class="admin-btn-group">
                        <button class="admin-action" id="adm-dec">-</button>
                        <span style="font-family:'Orbitron'; font-size:0.9rem; color:#fff;">ALTER RANK VALUE</span>
                        <button class="admin-action" id="adm-inc">+</button>
                    </div>
                </div>

                <p id="p-desc" class="profile-desc">Establishing stable remote data link...</p>
            </div>
        </div>
    </div>

    <div class="stealth-portal">
        <span>v2.6.1-PRIME_</span>
        <input type="password" id="covert-key" class="stealth-input" maxlength="7" autocomplete="off">
    </div>

    <script>
        // ARCHIVE DATA STREAM: Upvotes & Downvotes run isolated from core score values
        let rankingsData = [
            { id: "rank_0", name: "Darius, Vidhur, & Mukil", score: 0, upvotes: 0, downvotes: 0, desc: "System Sovereigns. Their data broken. Voting logic immune.", img: "images/0.jpg" },
            { id: "rank_1", name: "Sofiane Moundir", score: 99, upvotes: 0, downvotes: 0, desc: "The ultimate walking paradox. Undeniably the biggest chud, yet radiates Chad energy.", img: "images/1.jpg" },
            { id: "rank_2", name: "Chudley", score: 98, upvotes: 0, downvotes: 0, desc: "An absolute unit. Emits pure radioactive power cells.", img: "images/2.jpg" },
            { id: "rank_3", name: "GigaChud", score: 97, upvotes: 0, downvotes: 0, desc: "Jawline completely sharper than a diamond pickaxe.", img: "images/3.jpg" },
            { id: "rank_4", name: "Barnaby", score: 95, upvotes: 0, downvotes: 0, desc: "Eats structural drywall panels for breakfast.", img: "images/4.jpg" },
            
            // AUTOMATED ALLOCATION SLOTS (5 - 69)
            ...Array.from({length: 65}, (_, i) => ({
                id: `rank_${i + 5}`,
                name: `Subject_${i + 5}`,
                score: Math.max(0, 90 - (i * 2)),
                upvotes: 0,
                downvotes: 0,
                desc: "Data file uninitialized.",
                img: `images/${i + 5}.jpg`
            }))
        ];

        const listFrame = document.getElementById('list-frame');
        const searchBar = document.getElementById('search-bar');
        const covertKey = document.getElementById('covert-key');
        const emptyView = document.getElementById('empty-view');
        const dossierLayout = document.getElementById('dossier-layout');
        const detailFrame = document.getElementById('detail-frame');

        let currentActiveId = null;
        let searchFilter = "";
        let adminAuthorized = false;

        function displayToast(text, mode = 'normal') {
            const toast = document.getElementById('alert-toast');
            toast.textContent = text;
            toast.className = `toast ${mode === 'err' ? 'err' : mode === 'adm' ? 'adm' : ''}`;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2500);
        }

        function sortData() {
            const sovereign = rankingsData[0];
            const mortals = rankingsData.slice(1).sort((a, b) => b.score - a.score);
            rankingsData = [sovereign, ...mortals];
        }

        function buildList() {
            listFrame.innerHTML = '';
            const query = searchFilter.toLowerCase();
            const matchingData = rankingsData.filter(item => item.name.toLowerCase().includes(query));

            matchingData.forEach(item => {
                const originalIndex = rankingsData.findIndex(c => c.id === item.id);
                const isSovereign = originalIndex === 0;

                const node = document.createElement('div');
                node.className = `rank-item ${isSovereign ? 'god-tier' : ''} ${item.id === currentActiveId ? 'active' : ''}`;
                
                // Show public vote tallies instantly alongside the row item
                node.innerHTML = `
                    <div class="rank-number">#${originalIndex}</div>
                    <div class="rank-name">${item.name}</div>
                    <div class="vote-tallies">
                        <span class="tally-up">▲${item.upvotes}</span>
                        <span class="tally-down">▼${item.downvotes}</span>
                    </div>
                    <div class="rank-score-mini">${item.score}</div>
                `;
                node.addEventListener('click', () => populateDossier(item.id));
                listFrame.appendChild(node);
            });
        }

        function populateDossier(id) {
            currentActiveId = id;
            const item = rankingsData.find(c => c.id === id);
            const isSovereign = rankingsData.indexOf(item) === 0;

            buildList();
            emptyView.style.display = 'none';
            dossierLayout.style.display = 'flex';

            document.getElementById('p-name').textContent = item.name;
            document.getElementById('p-score').textContent = item.score;
            document.getElementById('p-desc').textContent = item.desc;
            document.getElementById('p-img').src = item.img;

            if (isSovereign) {
                detailFrame.classList.add('god-active');
                document.getElementById('public-console').style.display = 'none';
                document.querySelector('.admin-override-box').style.display = 'none';
            } else {
                detailFrame.classList.remove('god-active');
                document.querySelector('.admin-override-box').style.display = adminAuthorized ? 'flex' : 'none';
                document.getElementById('public-console').style.display = adminAuthorized ? 'none' : 'flex';
            }
        }

        // HIDDEN AUTH INGESTION NODE
        covertKey.addEventListener('input', (e) => {
            if (e.target.value === '12467') {
                adminAuthorized = true;
                toggleAdminUI();
                e.target.value = ''; 
            }
        });

        // HIDDEN SYSTEM PURGE LINK (Click Header to Disengage)
        function disengageOverride() {
            if (!adminAuthorized) return;
            adminAuthorized = false;
            toggleAdminUI();
            displayToast("ADMIN CORES PURGED", "err");
        }

        function toggleAdminUI() {
            document.body.classList.toggle('admin-mode', adminAuthorized);
            document.getElementById('system-title').textContent = adminAuthorized ? '// CHUD_RANKINGS_ADMIN_OVERRIDE' : '// CHUD_RANKINGS_';
            if (adminAuthorized) displayToast("ACCESS GRANTED: ADMIN HUB OPENED", "adm");
            if (currentActiveId) populateDossier(currentActiveId);
            buildList();
        }

        searchBar.addEventListener('input', (e) => {
            searchFilter = e.target.value;
            buildList();
        });

        // PUBLIC VOTING MODULE - Logs votes, doesn't touch base score
        function executePublicVote(direction) {
            if (!currentActiveId) return;
            const idx = rankingsData.findIndex(c => c.id === currentActiveId);
            if (idx === 0) return;

            const targetTime = Date.now();
            const timeframe = 24 * 60 * 60 * 1000; 
            const trackingKey = direction === 'up' ? 'matrix_cooldown_up' : 'matrix_cooldown_down';
            const registration = localStorage.getItem(trackingKey);

            if (registration && (targetTime - parseInt(registration)) < timeframe) {
                displayToast(`REJECTED: 24H ${direction.toUpperCase()}VOTE COOLDOWN ACTIVE`, "err");
                return;
            }

            if (direction === 'up') rankingsData[idx].upvotes += 1;
            else rankingsData[idx].downvotes += 1;

            localStorage.setItem(trackingKey, targetTime.toString());
            displayToast(`VOTE RECORDED UNDER CURRENT DISPATCH`);
            buildList(); 
        }

        document.getElementById('btn-up').addEventListener('click', () => executePublicVote('up'));
        document.getElementById('btn-down').addEventListener('click', () => executePublicVote('down'));

        // ADMIN EXCLUSIVE DESTRUCTIVE/CONSTRUCTIVE MATRIX SHIFTS
        function forceValueShift(amount) {
            if (!currentActiveId || !adminAuthorized) return;
            const idx = rankingsData.findIndex(c => c.id === currentActiveId);
            if (idx === 0) return;

            rankingsData[idx].score += amount;
            sortData();
            populateDossier(currentActiveId);
            displayToast("CORE RE-INDEXED", "adm");
        }

        document.getElementById('adm-inc').addEventListener('click', () => forceValueShift(1));
        document.getElementById('adm-dec').addEventListener('click', () => forceValueShift(-1));

        sortData();
        buildList();
    </script>
</body>
</html>
