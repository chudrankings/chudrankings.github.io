<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chud Rankings</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --bg-color: #030303;
            --panel-bg: #0b0b0b;
            --neon-green: #39ff14;
            --neon-red: #ff073a;
            --text-main: #ffffff;
            --text-muted: #666666;
            --border-glow: rgba(57, 255, 20, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Cyberpunk Scanline Effect Background */
        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Tactical Header */
        .header {
            padding: 20px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            letter-spacing: 3px;
            border-bottom: 1px solid #1a1a1a;
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

        /* Main Workspace Layout */
        .container {
            display: flex;
            flex: 1;
            padding: 20px;
            gap: 20px;
            height: calc(100vh - 80px);
            overflow: hidden;
        }

        /* Left Side: Scrollable Database List */
        .list-section {
            flex: 1.2;
            background: var(--panel-bg);
            border: 1px solid #222;
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            position: relative;
        }

        .list-section::-webkit-scrollbar { width: 6px; }
        .list-section::-webkit-scrollbar-track { background: #050505; }
        .list-section::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 3px; }

        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background: #111;
            margin-bottom: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid #1a1a1a;
            border-left: 4px solid #333;
        }

        .rank-item:hover {
            background: #161616;
            border-color: #444;
            transform: translateX(4px);
        }

        .rank-item.active {
            background: #1a1a1a;
            border-color: var(--neon-green);
            border-left: 4px solid var(--neon-green);
            box-shadow: 0 0 15px var(--border-glow);
        }

        /* INSANE GOD-TIER RANK #0 STYLE */
        .rank-item.god-tier {
            border-left: 4px solid var(--neon-red);
            background: linear-gradient(90deg, rgba(255, 7, 58, 0.12), transparent);
            animation: system-glitch-pulse 2s infinite alternate;
            border-color: rgba(255, 7, 58, 0.4);
        }

        .rank-item.god-tier.active {
            border-left: 4px solid var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 7, 58, 0.4);
        }

        .rank-item.god-tier .rank-number {
            color: var(--neon-red) !important;
            text-shadow: 0 0 10px var(--neon-red);
        }

        .rank-item.god-tier .rank-score-mini {
            background: rgba(255, 7, 58, 0.15);
            border-color: var(--neon-red);
            color: var(--neon-red);
            text-shadow: 0 0 5px var(--neon-red);
        }

        @keyframes system-glitch-pulse {
            0% { box-shadow: 0 0 4px rgba(255, 7, 58, 0.1); }
            100% { box-shadow: 0 0 12px rgba(255, 7, 58, 0.3); }
        }

        .rank-number {
            font-family: 'Orbitron', sans-serif;
            color: var(--neon-green);
            font-size: 1.1rem;
            font-weight: 700;
            width: 45px;
        }

        .rank-name {
            flex: 1;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 10px;
        }

        .rank-score-mini {
            font-family: 'Orbitron', sans-serif;
            color: var(--text-main);
            background: #222;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.9rem;
            font-weight: 900;
            border: 1px solid #333;
        }

        .rank-item.active .rank-score-mini {
            background: rgba(57, 255, 20, 0.1);
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        /* Right Side: Visual Data Terminal */
        .detail-section {
            flex: 1;
            background: radial-gradient(circle at top, #141414 0%, var(--panel-bg) 100%);
            border: 1px solid #222;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .detail-hud-actions {
            width: 100%;
            display: none;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .close-btn {
            background: rgba(255, 7, 58, 0.1);
            color: var(--neon-red);
            border: 1px solid var(--neon-red);
            font-family: 'Orbitron', sans-serif;
            padding: 8px 16px;
            font-weight: 700;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s;
        }

        .close-btn:active {
            background: var(--neon-red);
            color: #000;
        }

        .profile-img-container {
            width: 220px;
            height: 220px;
            border-radius: 8px;
            border: 2px solid var(--neon-green);
            box-shadow: 0 0 20px rgba(57, 255, 20, 0.2);
            overflow: hidden;
            margin-bottom: 25px;
            background-color: #0d0d0d;
            position: relative;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
        }

        .profile-score {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--neon-green);
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(57, 255, 20, 0.4);
            background: rgba(57, 255, 20, 0.05);
            padding: 4px 16px;
            border-radius: 20px;
            border: 1px solid rgba(57, 255, 20, 0.2);
        }

        /* Dynamically changes to Red glow when selecting Rank 0 */
        .detail-section.god-tier-active .profile-img-container {
            border-color: var(--neon-red);
            box-shadow: 0 0 25px rgba(255, 7, 58, 0.5);
        }
        .detail-section.god-tier-active .profile-score {
            color: var(--neon-red);
            text-shadow: 0 0 10px rgba(255, 7, 58, 0.5);
            background: rgba(255, 7, 58, 0.05);
            border-color: rgba(255, 7, 58, 0.3);
        }

        .profile-desc {
            font-size: 1.15rem;
            color: #b3b3b3;
            text-align: center;
            line-height: 1.5;
            max-width: 90%;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #1a1a1a;
        }

        #profile-content {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #empty-state {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: var(--text-muted);
            font-family: 'Orbitron', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            border: 1px dashed #222;
            width: 100%;
            border-radius: 8px;
        }

        /* Mobile Layout Modifications */
        @media (max-width: 820px) {
            body {
                height: 100vh;
                position: relative;
            }

            .header {
                font-size: 1.4rem;
                padding: 15px 20px;
                text-align: center;
            }

            .container {
                padding: 10px;
                position: relative;
                height: calc(100vh - 60px);
            }

            .list-section {
                flex: 1;
                width: 100%;
                border-radius: 8px;
            }

            .detail-section {
                position: fixed;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 85vh;
                z-index: 100;
                border-radius: 20px 20px 0 0;
                border-top: 2px solid var(--neon-green);
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.95), 0 -5px 25px var(--border-glow);
                transform: translateY(105%);
                padding: 25px 20px;
                background: #090909;
            }

            .detail-section.god-tier-active {
                border-top: 2px solid var(--neon-red);
                box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.95), 0 -5px 25px rgba(255, 7, 58, 0.4);
            }

            .detail-section.mobile-open {
                transform: translateY(0);
            }

            .detail-hud-actions {
                display: flex;
            }

            .profile-img-container {
                width: 180px;
                height: 180px;
                margin-bottom: 20px;
            }

            .profile-name {
                font-size: 1.8rem;
            }

            .profile-score {
                font-size: 1.3rem;
                margin-bottom: 15px;
            }

            .profile-desc {
                font-size: 1.05rem;
                max-width: 100%;
            }

            #empty-state {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="header">// CHUD_RANKINGS_</div>

    <div class="container">
        <!-- Scrollable Leaderboard List -->
        <div class="list-section" id="list-container"></div>

        <!-- Pop-Up Tactical Detail View Terminal -->
        <div class="detail-section" id="detail-terminal">
            <div class="detail-hud-actions">
                <button class="close-btn" id="close-terminal">Back to List</button>
            </div>

            <div id="empty-state">SELECT SUBJECT FOR ANALYTICS</div>
            
            <div id="profile-content">
                <div class="profile-img-container">
                    <img id="display-img" class="profile-img" src="" alt="Face" onerror="this.src='https://via.placeholder.com/250/090909/39ff14?text=NO+DOSSIER+IMG'">
                </div>
                <h1 id="display-name" class="profile-name">Name</h1>
                <div class="profile-score">SCORE: <span id="display-score">0</span></div>
                <p id="display-desc" class="profile-desc">Description goes here.</p>
            </div>
        </div>
    </div>

    <script>
        // --- HARDCODED DATA CONFIGURATIONS ---
        // Rank #0 sits perfectly at index 0 with a score of 100.
        const chudData = [
            { name: "Darius and Vidhur", score: 100, desc: "System Sovereigns. Their absolute data structures completely shattered the baseline metrics of the ranking core.", img: "images/0.jpg" },
            { name: "Chudley", score: 99, desc: "An absolute unit. Emits pure radioactive power cells.", img: "images/1.jpg" },
            { name: "GigaChud", score: 98, desc: "Jawline completely sharper than a diamond pickaxe.", img: "images/2.jpg" },
            { name: "Barnaby", score: 95, desc: "Eats structural drywall panels for breakfast.", img: "images/3.jpg" },
            { name: "Grumbo", score: 92, desc: "Has not detected standard sunlight levels since 2018.", img: "images/4.jpg" },
            { name: "Zonk", score: 90, desc: "Operates entirely on automated synthetic gamer fuel.", img: "images/5.jpg" },
            { name: "Blorp", score: 88, desc: "Keyboard layout is entirely missing its WASD keys.", img: "images/6.jpg" },
            { name: "MegaGamer", score: 85, desc: "Permanently banned from 14 different sub-sectors.", img: "images/7.jpg" },
            { name: "Snorkel", score: 84, desc: "Maintains heavy tactical trench coat during summer heat.", img: "images/8.jpg" },
            { name: "Puck", score: 82, desc: "Sustained completely on micro-engineered instant ramen.", img: "images/9.jpg" },
            { name: "Vortex", score: 80, desc: "Claims to have repeatedly bypassed the local mainframe.", img: "images/10.jpg" }
        ];

        // Safely generate the remaining entries down to 70 total example slots
        const genericPrefixes = ["Hex", "Cipher", "Viper", "Glitch", "Acid", "Static", "Titan", "Null"];
        for(let i = 11; i <= 70; i++) {
            let computedName = genericPrefixes[i % genericPrefixes.length] + "_" + i;
            chudData.push({
                name: computedName,
                score: Math.floor(Math.random() * 41) + 35,
                desc: `System data file [${i}] currently uninitialized. Subject analysis tracking parameters pending clear field data input...`,
                img: `images/${i}.jpg`
            });
        }

        // Keep sorting fully structured (100 automatically sits at the top)
        chudData.sort((a, b) => b.score - a.score);

        const listContainer = document.getElementById('list-container');
        const detailTerminal = document.getElementById('detail-terminal');
        const emptyState = document.getElementById('empty-state');
        const profileContent = document.getElementById('profile-content');
        
        const displayImg = document.getElementById('display-img');
        const displayName = document.getElementById('display-name');
        const displayScore = document.getElementById('display-score');
        const displayDesc = document.getElementById('display-desc');
        const closeTerminalBtn = document.getElementById('close-terminal');

        let activeItem = null;

        // Populate Interface Leaderboard
        chudData.forEach((chud, index) => {
            const item = document.createElement('div');
            
            // Check if this is the god-tier score element to attach glitch aesthetics
            const isGodTier = chud.score === 100;
            item.className = `rank-item ${isGodTier ? 'god-tier' : ''}`;
            
            // Render index cleanly (0 for Darius/Vidhur, 1, 2, 3... for the rest)
            item.innerHTML = `
                <div class="rank-number">#${index}</div>
                <div class="rank-name">${chud.name}</div>
                <div class="rank-score-mini">${chud.score}</div>
            `;
            
            item.addEventListener('click', () => {
                if(activeItem) activeItem.classList.remove('active');
                item.classList.add('active');
                activeItem = item;

                if(emptyState) emptyState.style.display = 'none';
                profileContent.style.display = 'flex';

                // Map content into variables
                displayImg.src = chud.img;
                displayName.textContent = chud.name;
                displayScore.textContent = chud.score;
                displayDesc.textContent = chud.desc;

                // Adjust color theme dynamically if Rank #0 is open
                if(isGodTier) {
                    detailTerminal.classList.add('god-tier-active');
                    // Fallback placeholder image handling for Rank 0
                    displayImg.onerror = function() { this.src = 'https://via.placeholder.com/250/090909/ff073a?text=SYSTEM+BREAKERS'; };
                } else {
                    detailTerminal.classList.remove('god-tier-active');
                    displayImg.onerror = function() { this.src = 'https://via.placeholder.com/250/090909/39ff14?text=NO+DOSSIER+IMG'; };
                }

                // Handle Mobile view drawer slide-up
                detailTerminal.classList.add('mobile-open');
            });

            listContainer.appendChild(item);
        });

        // Close drawer (Mobile feature)
        closeTerminalBtn.addEventListener('click', () => {
            detailTerminal.classList.remove('mobile-open');
            if(activeItem) {
                activeItem.classList.remove('active');
                activeItem = null;
            }
        });
    </script>
</body>
</html>
