<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chud Rankings: Overdrive</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700;900&display=swap');

        :root {
            --bg-color: #020202;
            --panel-bg: rgba(10, 10, 10, 0.85);
            --neon-green: #39ff14;
            --neon-green-dim: #1a660a;
            --neon-red: #ff073a;
            --neon-admin: #bc13fe; /* Admin Mode Purple */
            --text-main: #ffffff;
            --text-muted: #555555;
            --border-glow: rgba(57, 255, 20, 0.4);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Glitching Header */
        .header {
            padding: 20px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: var(--neon-green);
            text-shadow: 0 0 15px var(--neon-green);
            letter-spacing: 4px;
            border-bottom: 1px solid var(--neon-green-dim);
            background: linear-gradient(90deg, rgba(10, 10, 10, 0.9), rgba(0, 0, 0, 0.9));
            backdrop-filter: blur(10px);
            z-index: 10;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.5s ease;
        }

        /* Admin Mode Header Shift */
        body.admin-mode .header {
            color: var(--neon-admin);
            text-shadow: 0 0 15px var(--neon-admin);
            border-bottom-color: var(--neon-admin);
        }

        .header span { animation: glitch-anim 3s infinite; }

        @keyframes glitch-anim {
            0% { transform: translate(0); }
            2% { text-shadow: -3px 0 red, 3px 0 blue; transform: translate(-2px, 1px); }
            4% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        .search-container { position: relative; width: 300px; }
        
        .search-bar {
            width: 100%;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid var(--neon-green-dim);
            color: var(--neon-green);
            font-family: 'Orbitron', sans-serif;
            padding: 10px 15px;
            border-radius: 4px;
            outline: none;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        body.admin-mode .search-bar {
            border-color: var(--neon-admin);
            color: var(--neon-admin);
        }

        .search-bar:focus { box-shadow: 0 0 15px var(--border-glow); border-color: var(--neon-green); }
        body.admin-mode .search-bar:focus { box-shadow: 0 0 15px var(--neon-admin); border-color: var(--neon-admin); }

        .container {
            display: flex; flex: 1; padding: 20px; gap: 20px;
            height: calc(100vh - 85px); overflow: hidden; z-index: 3; position: relative;
        }

        /* List Section */
        .list-section {
            flex: 1.2; background: var(--panel-bg); border: 1px solid var(--glass-border);
            border-radius: 12px; padding: 15px; overflow-y: auto; position: relative;
            backdrop-filter: blur(5px); box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        .list-section::-webkit-scrollbar { width: 4px; }
        .list-section::-webkit-scrollbar-track { background: transparent; }
        .list-section::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 2px; }

        .rank-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: rgba(20, 20, 20, 0.6); margin-bottom: 10px;
            border-radius: 8px; cursor: pointer; transition: all 0.25s;
            border: 1px solid transparent; border-left: 4px solid #333;
            animation: slide-in 0.3s ease-out forwards; opacity: 0; transform: translateX(-20px);
        }

        @keyframes slide-in { to { opacity: 1; transform: translateX(0); } }

        .rank-item:hover { background: rgba(30, 30, 30, 0.8); border-color: #444; transform: translateX(8px) scale(1.01); }
        
        .rank-item.active {
            background: rgba(15, 40, 15, 0.8); border-color: var(--neon-green);
            border-left: 4px solid var(--neon-green); box-shadow: 0 0 20px var(--border-glow);
        }

        /* Rank #0 Style */
        .rank-item.god-tier {
            border-left: 4px solid var(--neon-red); background: linear-gradient(90deg, rgba(255, 7, 58, 0.15), rgba(0,0,0,0.5));
            border-color: rgba(255, 7, 58, 0.4); animation: system-glitch-pulse 1.5s infinite alternate, slide-in 0.3s ease-out forwards;
        }
        .rank-item.god-tier.active {
            border-left: 4px solid var(--neon-red); border-color: var(--neon-red);
            box-shadow: 0 0 30px rgba(255, 7, 58, 0.5); background: linear-gradient(90deg, rgba(255, 7, 58, 0.25), rgba(0,0,0,0.8));
        }
        .rank-item.god-tier .rank-number, .rank-item.god-tier .rank-score-mini {
            color: var(--neon-red) !important; text-shadow: 0 0 15px var(--neon-red); border-color: var(--neon-red);
            background: rgba(255, 7, 58, 0.1);
        }

        @keyframes system-glitch-pulse {
            0% { box-shadow: inset 0 0 5px rgba(255, 7, 58, 0.2); }
            100% { box-shadow: inset 0 0 20px rgba(255, 7, 58, 0.5); }
        }

        .rank-number { font-family: 'Orbitron', sans-serif; color: var(--neon-green); font-size: 1.2rem; font-weight: 900; width: 50px; }
        .rank-name { flex: 1; font-size: 1.4rem; font-weight: 700; letter-spacing: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 15px; }
        .rank-score-mini { font-family: 'Orbitron', sans-serif; color: #fff; background: #000; padding: 4px 10px; border-radius: 6px; font-size: 1rem; font-weight: 900; border: 1px solid var(--text-muted); min-width: 50px; text-align: center; }
        .rank-item.active .rank-score-mini { border-color: var(--neon-green); color: var(--neon-green); text-shadow: 0 0 8px var(--neon-green); }

        /* Detail Section */
        .detail-section {
            flex: 1; background: radial-gradient(circle at top right, rgba(20,20,20,0.9) 0%, rgba(5,5,5,0.95) 100%);
            border: 1px solid var(--glass-border); border-radius: 12px; display: flex; flex-direction: column;
            align-items: center; padding: 30px; position: relative; box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }

        .detail-hud-actions { width: 100%; display: none; justify-content: flex-end; margin-bottom: 10px; }
        .close-btn { background: rgba(255, 7, 58, 0.1); color: var(--neon-red); border: 1px solid var(--neon-red); font-family: 'Orbitron', sans-serif; padding: 8px 16px; font-weight: 700; border-radius: 4px; cursor: pointer; }

        .profile-img-container { width: 200px; height: 200px; border-radius: 12px; border: 2px solid var(--neon-green); box-shadow: 0 0 25px rgba(57, 255, 20, 0.2); overflow: hidden; margin-bottom: 20px; background-color: #050505; position: relative; }
        .profile-img { width: 100%; height: 100%; object-fit: cover; }

        .profile-name { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; text-align: center; text-shadow: 0 0 10px rgba(255,255,255,0.4); }

        /* Public Voting UI */
        .vote-console {
            display: flex; align-items: center; gap: 25px; margin-bottom: 20px;
            background: rgba(0,0,0,0.6); padding: 15px 30px; border-radius: 8px; border: 1px solid #333;
        }

        .vote-btn {
            background: transparent; border: 1px solid #555; border-radius: 4px; color: var(--text-muted);
            font-size: 1.2rem; font-family: 'Orbitron', sans-serif; padding: 8px 15px; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .vote-btn:hover { background: rgba(255,255,255,0.05); }
        .vote-btn.up:active { border-color: var(--neon-green); color: var(--neon-green); }
        .vote-btn.down:active { border-color: var(--neon-red); color: var(--neon-red); }

        /* Admin Override Panel (Hidden by Default) */
        .admin-panel {
            display: none; flex-direction: column; align-items: center; width: 100%;
            background: rgba(188, 19, 254, 0.05); border: 1px dashed var(--neon-admin);
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }
        body.admin-mode .admin-panel { display: flex; }
        body.admin-mode .vote-console { display: none; } /* Hide public voting when admin is active */

        .admin-title { font-family: 'Orbitron', sans-serif; color: var(--neon-admin); font-size: 0.9rem; margin-bottom: 10px; letter-spacing: 2px; }
        .admin-stats { display: flex; gap: 20px; margin-bottom: 15px; color: #ccc; font-family: 'Orbitron', sans-serif; }
        .admin-stats span.up { color: var(--neon-green); }
        .admin-stats span.down { color: var(--neon-red); }

        .admin-score-editor { display: flex; align-items: center; gap: 15px; }
        .admin-edit-btn {
            background: rgba(188, 19, 254, 0.1); border: 1px solid var(--neon-admin);
            color: var(--neon-admin); font-size: 1.5rem; width: 40px; height: 40px; border-radius: 4px;
            cursor: pointer; transition: all 0.2s; font-family: 'Orbitron', sans-serif;
        }
        .admin-edit-btn:active { background: var(--neon-admin); color: #000; }

        .profile-score { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; color: var(--neon-green); font-weight: 900; text-shadow: 0 0 15px rgba(57, 255, 20, 0.6); min-width: 60px; text-align: center; margin-bottom: 15px;}
        
        .profile-desc { font-size: 1.15rem; color: #ccc; text-align: center; line-height: 1.6; width: 100%; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border: 1px solid #222; margin-bottom: 25px; }

        /* System Toast Notification */
        .toast {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid var(--neon-green);
            color: var(--neon-green); font-family: 'Orbitron', sans-serif; padding: 12px 25px;
            border-radius: 4px; box-shadow: 0 0 20px rgba(57,255,20,0.4); font-size: 1rem;
            z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .toast.error { border-color: var(--neon-red); color: var(--neon-red); box-shadow: 0 0 20px rgba(255,7,58,0.4); }
        .toast.admin { border-color: var(--neon-admin); color: var(--neon-admin); box-shadow: 0 0 20px rgba(188,19,254,0.4); }

        #profile-content { display: none; flex-direction: column; align-items: center; width: 100%; height: 100%; }
        #empty-state { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: var(--text-muted); font-family: 'Orbitron', sans-serif; font-size: 1.2rem; letter-spacing: 2px; text-align: center; border: 1px dashed #333; width: 100%; border-radius: 8px; animation: pulse 2s infinite; }

        /* Detail God Tier Active */
        .detail-section.god-tier-active .profile-img-container { border-color: var(--neon-red); box-shadow: 0 0 35px rgba(255, 7, 58, 0.6); }
        .detail-section.god-tier-active .profile-score { color: var(--neon-red); text-shadow: 0 0 20px rgba(255, 7, 58, 0.8); }

        /* Mobile Adjustments */
        @media (max-width: 820px) {
            .header { font-size: 1.2rem; flex-direction: column; gap: 10px; }
            .search-container { width: 100%; }
            .container { padding: 10px; height: calc(100vh - 120px); }
            .detail-section { position: fixed; bottom: 0; left: 0; width: 100%; height: 90vh; z-index: 100; border-radius: 20px 20px 0 0; border-top: 2px solid var(--neon-green); background: rgba(5,5,5,0.98); backdrop-filter: blur(15px); transform: translateY(105%); transition: transform 0.4s; }
            .detail-section.god-tier-active { border-top-color: var(--neon-red); }
            body.admin-mode .detail-section { border-top-color: var(--neon-admin); }
            .detail-section.mobile-open { transform: translateY(0); }
            .detail-hud-actions { display: flex; }
            #empty-state { display: none; }
        }
    </style>
</head>
<body>

    <div class="header">
        <span id="header-text">// CHUD_RANKINGS_ </span>
        <div class="search-container">
            <input type="text" id="search-bar" class="search-bar" placeholder="SEARCH DATABASE...">
        </div>
    </div>

    <div id="system-toast" class="toast">SYSTEM MESSAGE</div>

    <div class="container">
        <div class="list-section" id="list-container"></div>

        <div class="detail-section" id="detail-terminal">
            <div class="detail-hud-actions">
                <button class="close-btn" id="close-terminal">CLOSE HUD</button>
            </div>

            <div id="empty-state">
                <div style="font-size: 3rem; margin-bottom:10px;">?</div>
                AWAITING SUBJECT OVERRIDE
            </div>
            
            <div id="profile-content">
                <div class="profile-img-container">
                    <img id="display-img" class="profile-img" src="" alt="Face">
                </div>
                <h1 id="display-name" class="profile-name">Name</h1>
                
                <div class="profile-score">SCORE: <span id="display-score">0</span></div>

                <div class="admin-panel" id="admin-panel">
                    <div class="admin-title">ADMIN OVERRIDE ACTIVE</div>
                    <div class="admin-stats">
                        Pending Upvotes: <span class="up" id="admin-upvotes">0</span> | 
                        Pending Downvotes: <span class="down" id="admin-downvotes">0</span>
                    </div>
                    <div class="admin-score-editor">
                        <button class="admin-edit-btn" id="admin-minus">-</button>
                        <span style="font-family: 'Orbitron'; font-size: 1.2rem; color: #fff;">ADJUST SCORE</span>
                        <button class="admin-edit-btn" id="admin-plus">+</button>
                    </div>
                </div>

                <div class="vote-console" id="vote-console">
                    <button class="vote-btn up" id="vote-up">▲ UPVOTE</button>
                    <button class="vote-btn down" id="vote-down">▼ DOWNVOTE</button>
                </div>

                <p id="display-desc" class="profile-desc">Description goes here.</p>
            </div>
        </div>
    </div>

    <script>
        // Data Structure (Now includes hidden pending votes)
        let chudData = [
            { id: "god_0", name: "Darius, Vidhur & Mukil", score: 0, upvotes: 0, downvotes: 0, desc: "System Sovereigns. Their collective data structures completely overflowed the matrix, permanently breaking the system. Voting logic immune.", img: "images/0.jpg" },
            { id: "c_1", name: "Sofiane Moundir", score: 99, upvotes: 42, downvotes: 3, desc: "The ultimate walking paradox. Undeniably the biggest chud to ever roam the matrix, yet radiates absolute legendary Chad energy. A complete anomaly.", img: "images/1.jpg" },
            { id: "c_2", name: "Chudley", score: 98, upvotes: 12, downvotes: 1, desc: "An absolute unit. Emits pure radioactive power cells.", img: "images/2.jpg" },
            { id: "c_3", name: "GigaChud", score: 97, upvotes: 24, downvotes: 5, desc: "Jawline completely sharper than a diamond pickaxe.", img: "images/3.jpg" },
            { id: "c_4", name: "Barnaby", score: 95, upvotes: 8, downvotes: 2, desc: "Eats structural drywall panels for breakfast.", img: "images/4.jpg" }
        ];

        // Generate the rest
        const genericPrefixes = ["Hex", "Cipher", "Viper", "Glitch", "Acid", "Static", "Titan", "Null"];
        for(let i = 5; i <= 70; i++) {
            chudData.push({
                id: `gen_${i}`,
                name: genericPrefixes[i % genericPrefixes.length] + "_" + i,
                score: Math.floor(Math.random() * 41) + 35,
                upvotes: Math.floor(Math.random() * 10),
                downvotes: Math.floor(Math.random() * 5),
                desc: `System data file [${i}] currently uninitialized. Field data pending...`,
                img: `images/${i}.jpg`
            });
        }

        // DOM Elements
        const listContainer = document.getElementById('list-container');
        const searchBar = document.getElementById('search-bar');
        const detailTerminal = document.getElementById('detail-terminal');
        const emptyState = document.getElementById('empty-state');
        const profileContent = document.getElementById('profile-content');
        
        const displayImg = document.getElementById('display-img');
        const displayName = document.getElementById('display-name');
        const displayScore = document.getElementById('display-score');
        const displayDesc = document.getElementById('display-desc');
        
        const voteConsole = document.getElementById('vote-console');
        const adminPanel = document.getElementById('admin-panel');
        const adminUpvotes = document.getElementById('admin-upvotes');
        const adminDownvotes = document.getElementById('admin-downvotes');
        const toast = document.getElementById('system-toast');

        let activeSubjectId = null;
        let searchQuery = "";
        let isAdminMode = false;

        function showToast(msg, type = 'normal') {
            toast.textContent = msg;
            toast.className = `toast ${type}`;
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 3000);
        }

        function sortMatrix() {
            const godTier = chudData[0];
            const mortals = chudData.slice(1);
            mortals.sort((a, b) => b.score - a.score);
            chudData = [godTier, ...mortals];
        }

        function renderList() {
            const currentScroll = listContainer.scrollTop;
            listContainer.innerHTML = '';

            const filteredData = chudData.filter(chud => 
                chud.name.toLowerCase().includes(searchQuery.toLowerCase())
            );

            filteredData.forEach((chud) => {
                const realIndex = chudData.findIndex(c => c.id === chud.id);
                const isGodTier = realIndex === 0;

                const item = document.createElement('div');
                item.className = `rank-item ${isGodTier ? 'god-tier' : ''} ${chud.id === activeSubjectId ? 'active' : ''}`;
                
                item.innerHTML = `
                    <div class="rank-number">#${realIndex}</div>
                    <div class="rank-name">${chud.name}</div>
                    <div class="rank-score-mini">${chud.score}</div>
                `;
                
                item.addEventListener('click', () => loadDossier(chud.id));
                listContainer.appendChild(item);
            });
            listContainer.scrollTop = currentScroll;
        }

        function loadDossier(id) {
            activeSubjectId = id;
            const chud = chudData.find(c => c.id === id);
            const isGodTier = chudData.indexOf(chud) === 0;

            renderList(); // Highlight list

            emptyState.style.display = 'none';
            profileContent.style.display = 'flex';
            detailTerminal.classList.add('mobile-open');

            displayName.textContent = chud.name;
            displayScore.textContent = chud.score;
            displayDesc.textContent = chud.desc;
            displayImg.src = chud.img;

            // Admin Data Inject
            adminUpvotes.textContent = chud.upvotes;
            adminDownvotes.textContent = chud.downvotes;

            if(isGodTier) {
                detailTerminal.classList.add('god-tier-active');
                displayImg.onerror = function() { this.src = 'https://via.placeholder.com/250/050505/ff073a?text=IMMUNE'; };
                voteConsole.style.display = 'none';
                adminPanel.style.display = 'none'; // Admins can't touch Rank 0
            } else {
                detailTerminal.classList.remove('god-tier-active');
                displayImg.onerror = function() { this.src = 'https://via.placeholder.com/250/050505/39ff14?text=NO+DATA'; };
                
                if (isAdminMode) {
                    voteConsole.style.display = 'none';
                    adminPanel.style.display = 'flex';
                } else {
                    voteConsole.style.display = 'flex';
                    adminPanel.style.display = 'none';
                }
            }
        }

        // --- PUBLIC VOTING WITH 24H COOLDOWN ---
        function castPublicVote(type) {
            if (!activeSubjectId) return;
            const chudIndex = chudData.findIndex(c => c.id === activeSubjectId);
            if (chudIndex === 0) return; // Immune

            // Check Local Storage Cooldown
            const lastVoteTime = localStorage.getItem('chud_matrix_last_vote');
            const now = Date.now();
            const cooldownPeriod = 24 * 60 * 60 * 1000; // 24 hours in milliseconds

            if (lastVoteTime && (now - parseInt(lastVoteTime)) < cooldownPeriod) {
                showToast("ACCESS DENIED: 24H VOTE COOLDOWN ACTIVE", "error");
                return;
            }

            // Register Vote
            if (type === 'up') chudData[chudIndex].upvotes++;
            else chudData[chudIndex].downvotes++;

            // Lock Voting
            localStorage.setItem('chud_matrix_last_vote', now.toString());
            
            showToast("VOTE LOGGED FOR ADMIN REVIEW. 24H COOLDOWN INITIATED.");
            loadDossier(activeSubjectId); // Refresh silent stats
        }

        document.getElementById('vote-up').addEventListener('click', () => castPublicVote('up'));
        document.getElementById('vote-down').addEventListener('click', () => castPublicVote('down'));

        // --- SECRET ADMIN OVERRIDE LOGIC ---
        searchBar.addEventListener('input', (e) => {
            searchQuery = e.target.value;

            // Secret Passcode Check
            if (searchQuery === '//ADMIN') {
                isAdminMode = !isAdminMode;
                document.body.classList.toggle('admin-mode', isAdminMode);
                document.getElementById('header-text').textContent = isAdminMode ? '// CHUD_MATRIX_ADMIN_MODE' : '// CHUD_MATRIX_OS';
                showToast(isAdminMode ? "ADMIN PRIVILEGES GRANTED" : "ADMIN LOGGED OUT", "admin");
                
                searchBar.value = '';
                searchQuery = '';
                if(activeSubjectId) loadDossier(activeSubjectId);
            }
            
            renderList();
        });

        // Admin Score Adjusters
        function adminChangeScore(delta) {
            if (!activeSubjectId || !isAdminMode) return;
            const chudIndex = chudData.findIndex(c => c.id === activeSubjectId);
            if (chudIndex === 0) return; // Immune

            chudData[chudIndex].score += delta;
            sortMatrix();
            loadDossier(activeSubjectId);
            showToast("MATRIX SCORE OVERRIDDEN", "admin");
        }

        document.getElementById('admin-plus').addEventListener('click', () => adminChangeScore(1));
        document.getElementById('admin-minus').addEventListener('click', () => adminChangeScore(-1));
        
        document.getElementById('close-terminal').addEventListener('click', () => {
            detailTerminal.classList.remove('mobile-open');
        });

        // Initial Boot
        sortMatrix();
        renderList();
    </script>
</body>
</html>
